[package]
name = "tihulu-gnome-clipboard-helper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native clipboard storage helper for the Tihulu GNOME Shell extension"

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
keyring = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"
