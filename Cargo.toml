[package]
name = "tihulu-clipboard-manager"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A COSMIC panel clipboard manager applet with visible erase-all controls."
repository = "https://github.com/Tihulu/tihulu-clipboard-manager"

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
futures = "0.3"
i18n-embed-fl = "0.10"
keyring = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
rust-embed = "8.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.0", features = ["full"] }
zeroize = "1.8"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
