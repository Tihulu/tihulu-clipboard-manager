name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: bash scripts/ci-deps.sh
      - name: Cargo check
        run: cargo check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: bash scripts/ci-deps.sh
      - name: Tests
        run: cargo test --all-targets --all-features

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format root crate
        run: cargo fmt --all
      - name: Format GNOME helper
        run: cargo fmt --manifest-path gnome/native-helper/Cargo.toml --all

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: bash scripts/ci-deps.sh
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  gnome-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check GNOME helper
        run: cargo check --manifest-path gnome/native-helper/Cargo.toml
      - name: Test GNOME helper
        run: cargo test --manifest-path gnome/native-helper/Cargo.toml --all-targets --all-features
      - name: Clippy GNOME helper
        run: cargo clippy --manifest-path gnome/native-helper/Cargo.toml --all-targets --all-features -- -D warnings

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit root crate
        run: bash scripts/cargo-audit.sh
      - name: Audit GNOME helper
        run: cd gnome/native-helper && cargo generate-lockfile && bash ../../scripts/cargo-audit.sh
